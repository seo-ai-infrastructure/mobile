plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.duoplus_probe'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.duoplus_probe'
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName '1.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'packaging'
    productFlavors {
        probe {
            dimension 'packaging'
            // Preserve the installed 1.2 application ID for an in-place update.
            buildConfigField 'boolean', 'HOOK_MODE', 'false'
        }
    }
}

dependencies {
    // AndroidX transitively mixes pre/post-1.8 stdlib layouts unless aligned.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.20')
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.car.app:app:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation('androidx.car.app:app-testing:1.4.0') {
        // Device tests use host DTOs, not FakeHost's JVM-only notification helper.
        exclude group: 'org.robolectric'
    }
}
