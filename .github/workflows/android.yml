name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build, unit tests and lint
        run: ./plugin/build.sh :probe:assembleDebug :probe:assembleDebugAndroidTest :probe:testDebugUnitTest :probe:lintDebug
      - name: Validate Python compiler and cross-language schemas
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m unittest discover -s tests
          python scenario_cli.py validate --scenario examples/probe/demo-scenario.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hooking-debug
          if-no-files-found: error
          path: |
            plugin/probe/build/outputs/apk/debug/probe-debug.apk
            plugin/probe/build/reports/
            plugin/probe/build/test-results/
